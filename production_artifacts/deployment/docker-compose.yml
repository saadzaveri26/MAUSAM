# Prototype-scale orchestration. Run from the repo root:
#   docker compose -f production_artifacts/deployment/docker-compose.yml up --build
#
# Production note: replace the `api` service's SQLite volume with a managed
# PostgreSQL/TimescaleDB instance, and front `web` with the nginx config in
# this same folder (or a CDN) once traffic requires it.

version: "3.9"

services:
  api:
    build:
      context: ../../
      dockerfile: production_artifacts/deployment/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app
    environment:
      - DATABASE_URL=sqlite:////app/weather_platform.db

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../../app_build/frontend:/usr/share/nginx/html/app:ro
      - ../../html_landing_page:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  api_data:
