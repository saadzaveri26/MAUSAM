server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Public landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard / Admin / Citizen report SPA-style pages
    location /app/ {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
